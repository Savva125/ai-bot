[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-desk"
version = "0.2.0"
description = "Compact desktop assistant for a user-selected window"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
desktop = ["PySide6>=6.8,<7", "keyring>=25,<26", "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'", "psutil>=6,<8"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "aiogram>=3.18,<4"]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
creator-desk = "creator_desk.app:main"
creator-desk-server-db = "creator_desk_server.manage:main"
creator-desk-admin-bot = "creator_desk_server.bot:main"

[tool.setuptools.packages.find]
include = ["creator_desk*", "creator_desk_server*"]

[tool.setuptools.package-data]
creator_desk = ["client-config.json"]
creator_desk_server = ["migrations/*.py", "migrations/versions/*.py"]

[tool.setuptools.data-files]
"migrations" = ["migrations/env.py", "migrations/script.py.mako"]
"migrations/versions" = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
